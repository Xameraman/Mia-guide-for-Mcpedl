:root {

  --darkgrass: #3A5F1E;
  --dirt: #8B6340;
  --sky: #87CEEB;
  --deepsky: #3A8FC7;

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {

  font-family: 'Nunito', sans-serif;
  color: var(--light);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;

/* ── Animated grid background ── */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(93,158,49,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(93,158,49,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  animation: gridMove 20s linear infinite;
  pointer-events: none;
  z-index: 0;
}
@keyframes gridMove {
  0% { background-position: 0 0; }
  100% { background-position: 48px 48px; }
}

.floating-pixels {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
}
.pixel {
  position: absolute;
  border-radius: 2px;
  animation: float linear infinite;
}
@keyframes float {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  90% { opacity: 0.1; }
  100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
}

/* ── TOP BAR ── */
.top-bar {

  padding: 8px 20px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 14px;
  flex-wrap: wrap;

  top: 0;
  z-index: 100;
  box-shadow: 0 2px 24px rgba(93,158,49,0.15);
}
.top-bar-left {

}
.top-bar-logo {

  box-shadow: 0 0 14px rgba(93,158,49,0.4);
}
.top-bar-info {

}
.top-bar-name {

.top-bar-join {

/* ── WIZARD CONTAINER ── */
.wizard-container {

}
.step-panel { display: none; }
.step-panel.active { display: block; animation: fadeSlide 0.3s ease; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }

<script>
// Steps data with MIA tips
const steps = [
  {
    title: "👋 Welcome to the MCPEDL Download Guide",
    body: `
      <p>This interactive guide will walk you through downloading add‑ons, maps, texture packs, and more from <strong>MCPEDL</strong> — the largest Bedrock content site.</p>

    `,

  },
  {

    body: `
      <p>Head over to <strong>mcpedl.com</strong> and use the search bar or browse categories to find the add‑on, map, skin pack, or texture pack you want to download.</p>
      <div class="callout tip"><span class="callout-icon">💡</span><span>Use specific keywords (e.g. “PVP texture pack 1.21”) to narrow results quickly.</span></div>
    `,
    miaTip: "🌿 <strong>MIA Helps:</strong> Not sure where to look? MIA channels are organized by category — just pick a channel and you'll find curated packs with links ready to go."

  {
    title: "📄 Step 2: Open the Content Page",
    body: `
      <p>Once you find what you’re looking for, click its title or thumbnail to open the full content page. This is where download links, screenshots, and the description live.</p>
    `,
    miaTip: "🌿 <strong>MIA Helps:</strong> MIA posts include a link that takes you directly to the content page — no need to search or browse again."

  {
    title: "⏩ Step 3: Press “Skip to Download”",
    body: `

    `,
    miaTip: "🌿 <strong>MIA Helps:</strong> Many MIA links go straight to the download section (or even direct file), so you can skip this step entirely."
  },
  {
    title: "🗂️ Step 4: Pick the Right Version",
    body: `
      <p>You’ll see one or more download buttons, often labelled by Minecraft version (e.g. 1.20, 1.21). Choose the version that matches your game.</p>

      <div class="callout info" style="margin-top:12px;"><span class="callout-icon">ℹ️</span><span>Not sure what version you’re on? Open Minecraft → <strong>Settings → About</strong>, and your game version is shown there.</span></div>

    miaTip: "🌿 <strong>MIA Helps:</strong> MIA descriptions always specify the supported Minecraft versions — so you don't have to guess which one to pick."

    title: "⬇️ Step 5: Tap the Download Button",
    body: `
      <p>Tap the download button for the version you chose. It may lead to a direct <strong>.mcpack</strong> / <strong>.mcaddon</strong> file, or an external page (depending on the creator).</p>

    body: `

    body: `

      </ul>
      <div class="callout info" style="margin-top:12px;"><span class="callout-icon">🌿</span><span>All MIA links are pre‑checked and direct — so you skip the fake download buttons entirely.</span></div>
    `,
    miaTip: "🌿 <strong>MIA Helps:</strong> MIA is built to remove the friction from downloading Bedrock content. Fast, direct, organized — with proper credits always given. Join us and level up your Minecraft experience!"
  }

const totalSteps = steps.length;
let currentStep = 0;
const container = document.getElementById('stepContainer');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const indicator = document.getElementById('stepIndicator');
const progressFill = document.getElementById('progressFill');
const step6Btn = document.getElementById('step6ExtraBtn');

function renderSteps() {
  container.innerHTML = '';
  steps.forEach((step, index) => {
    const panel = document.createElement('div');
    panel.className = 'step-panel';
    panel.innerHTML = `
      <div class="step-title">
        <span class="step-num">${index === 0 ? 'INTRO' : `STEP ${index}`}</span>
        ${step.title}
      </div>
      <div class="step-body">${step.body}</div>
      <div class="callout mia-callout">
        <span class="callout-icon"><img src="mia-icon.png" alt="MIA" style="width:18px;height:18px;border-radius:3px;"></span>
        <span>${step.miaTip}</span>
      </div>
    `;
    container.appendChild(panel);
  });
}

function updateUI() {
  document.querySelectorAll('.step-panel').forEach((p, i) => {
    p.classList.toggle('active', i === currentStep);
  });
  prevBtn.disabled = currentStep === 0;
  nextBtn.disabled = currentStep === totalSteps - 1;
  indicator.textContent = `${currentStep + 1} / ${totalSteps}`;
  progressFill.style.width = `${((currentStep) / (totalSteps - 1)) * 100}%`;

  // Show the extra button only on step 6 (index 6)
  step6Btn.style.display = (currentStep === 6) ? 'block' : 'none';
}

function changeStep(direction) {
  const next = currentStep + direction;
  if (next >= 0 && next < totalSteps) {
    currentStep = next;
    updateUI();
    document.getElementById('stepContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// Initialize
renderSteps();
updateUI();
</script>

<!-- Floating pixels -->
<script>
(function() {
  const container = document.getElementById('pixelsContainer');
  const colors = ['#5D9E31','#47C96B','#FFD700','#C678FF','#fff','#5865F2'];
  for (let i = 0; i < 20; i++) {
    const pixel = document.createElement('div');
    pixel.className = 'pixel';
    const size = 3 + Math.random() * 4;
    pixel.style.width = size + 'px';
    pixel.style.height = size + 'px';
    pixel.style.left = Math.random() * 100 + '%';
    pixel.style.top = Math.random() * 100 + '%';
    pixel.style.background = colors[Math.floor(Math.random() * colors.length)];
    pixel.style.animationDuration = 6 + Math.random() * 10 + 's';
    pixel.style.animationDelay = Math.random() * 5 + 's';
    container.appendChild(pixel);
  }
})();
</script>
