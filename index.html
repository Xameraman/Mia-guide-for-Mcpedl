<script>
/* ─── Animated canvas background (stars, orbs, shooting stars, pixels) ─── */
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');

  let W, H;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = [];
  for (let i = 0; i < 160; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.85,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random(),
      speed: 0.003 + Math.random() * 0.006,
      phase: Math.random() * Math.PI * 2
    });
  }

  const ORB_COLORS = [
    'rgba(93,158,49,', 'rgba(71,201,107,', 'rgba(198,120,255,',
    'rgba(255,215,0,', 'rgba(88,101,242,'
  ];
  const ORBS = [];
  for (let i = 0; i < 7; i++) {
    ORBS.push({
      x: Math.random(),
      y: Math.random(),
      r: 60 + Math.random() * 120,
      col: ORB_COLORS[Math.floor(Math.random() * ORB_COLORS.length)],
      vx: (Math.random() - 0.5) * 0.00015,
      vy: (Math.random() - 0.5) * 0.00015,
      a: 0.04 + Math.random() * 0.05
    });
  }

  const PIX_COLS = ['#5D9E31','#7DC940','#FFD700','#47C96B','#C678FF','#fff','#5865F2'];
  const PIXELS = [];
  function spawnPixel() {
    return {
      x: Math.random(),
      y: 1.05,
      size: 3 + Math.random() * 5,
      col: PIX_COLS[Math.floor(Math.random() * PIX_COLS.length)],
      vx: (Math.random() - 0.5) * 0.0004,
      vy: -(0.0004 + Math.random() * 0.0008),
      a: 0,
      maxA: 0.4 + Math.random() * 0.35,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 1.2
    };
  }
  for (let i = 0; i < 28; i++) PIXELS.push(spawnPixel());

  let shooters = [];
  setInterval(() => {
    shooters.push({
      x: Math.random() * 0.6,
      y: Math.random() * 0.4,
      len: 80 + Math.random() * 140,
      speed: 0.006 + Math.random() * 0.008,
      progress: 0,
      a: 0.7 + Math.random() * 0.3,
      angle: Math.PI / 5 + (Math.random() - 0.5) * 0.3
    });
  }, 3200);

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#06091A');
    grad.addColorStop(0.5, '#0A1628');
    grad.addColorStop(1, '#0D2040');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (const o of ORBS) {
      o.x += o.vx; o.y += o.vy;
      if (o.x < -0.1) o.x = 1.1;
      if (o.x > 1.1) o.x = -0.1;
      if (o.y < -0.1) o.y = 1.1;
      if (o.y > 1.1) o.y = -0.1;
      const g = ctx.createRadialGradient(o.x*W, o.y*H, 0, o.x*W, o.y*H, o.r);
      g.addColorStop(0, o.col + o.a + ')');
      g.addColorStop(1, o.col + '0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x*W, o.y*H, o.r, 0, Math.PI*2);
      ctx.fill();
    }

    for (const s of stars) {
      const pulse = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      ctx.globalAlpha = s.a * pulse;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r * (0.8 + 0.3 * pulse), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    shooters = shooters.filter(s => s.progress < 1.3);
    for (const s of shooters) {
      s.progress += s.speed;
      const sx = s.x * W + Math.cos(s.angle) * s.progress * s.len * 3;
      const sy = s.y * H + Math.sin(s.angle) * s.progress * s.len * 3;
      const ex = sx - Math.cos(s.angle) * s.len;
      const ey = sy - Math.sin(s.angle) * s.len;
      const fade = s.progress > 0.8 ? 1 - (s.progress - 0.8) / 0.5 : 1;
      const lg = ctx.createLinearGradient(ex, ey, sx, sy);
      lg.addColorStop(0, 'rgba(255,255,255,0)');
      lg.addColorStop(1, `rgba(255,255,255,${s.a * fade})`);
      ctx.strokeStyle = lg;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = fade;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(sx, sy);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (let i = 0; i < PIXELS.length; i++) {
      const p = PIXELS[i];
      p.x += p.vx; p.y += p.vy;
      p.rot += p.rotV;
      p.a = Math.min(p.maxA, p.a + 0.008);
      if (p.y < -0.05) PIXELS[i] = spawnPixel();
      ctx.save();
      ctx.translate(p.x * W, p.y * H);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    t += 0.6;
    requestAnimationFrame(draw);
  }
  draw();
})();

// Step colors – one per step, can be customized
const stepColors = [
  '#00c6ff', // intro – cyan
  '#a78bfa', // step1 – purple
  '#f59e0b', // step2 – amber
  '#34d399', // step3 – emerald
  '#f87171', // step4 – red
  '#60a5fa', // step5 – blue
  '#f472b6', // step6 – pink
  '#00ff88'  // summary – green
];

const totalSteps = steps.length;
let currentStep = 0;
const container = document.getElementById('stepContainer');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const indicator = document.getElementById('stepIndicator');
const progressFill = document.getElementById('progressFill');
const step6Btn = document.getElementById('step6ExtraBtn');

function renderSteps() {
  container.innerHTML = '';
  steps.forEach((step, index) => {
    const panel = document.createElement('div');
    panel.className = 'step-panel';
    // Set the left border and step number color dynamically
    const color = stepColors[index % stepColors.length];
    panel.style.borderLeftColor = color;
    panel.innerHTML = `
      <div class="step-title">
        <span class="step-num" style="background:${color}; box-shadow: 0 0 14px ${color};">${index === 0 ? 'INTRO' : `STEP ${index}`}</span>
        ${step.title}
      </div>
      <div class="step-body">${step.body}</div>
      <div class="callout mia-callout">
        <span class="callout-icon"><img src="mia-icon.png" alt="MIA" style="width:18px;height:18px;border-radius:3px;"></span>
        <span>${step.miaTip}</span>
      </div>
    `;
    container.appendChild(panel);
  });
}

function updateUI() {
  document.querySelectorAll('.step-panel').forEach((p, i) => {
    p.classList.toggle('active', i === currentStep);
  });
  prevBtn.disabled = currentStep === 0;
  nextBtn.disabled = currentStep === totalSteps - 1;
  indicator.textContent = `${currentStep + 1} / ${totalSteps}`;
  progressFill.style.width = `${((currentStep) / (totalSteps - 1)) * 100}%`;
  step6Btn.style.display = (currentStep === 6) ? 'block' : 'none';
}

function changeStep(direction) {
  const next = currentStep + direction;
  if (next >= 0 && next < totalSteps) {
    currentStep = next;
    updateUI();
    document.getElementById('stepContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

renderSteps();
updateUI();
